),\n        cliente: {\n          nome: 'Juliana Moreira',\n          whats: '(11) 98123-4567',\n          endereco: 'Av. Brasil, 850 - Casa 3'\n        },\n        responsavel: '',\n        condicoes: {\n          prazo: '7 dias úteis',\n          pagto: '40% entrada e 60% na entrega',\n          validade: '10 Dias',\n          garantia: '90 dias'\n        },\n        totalGeral: 3850.00,\n        status: 'Pendente',\n        ocultarValores: false,\n        servicos: [\n          {\n            tipo: 'Gesso / Drywall',\n            tipoCustom: '',\n            cobranca: 'm2',\n            materialTipo: 'Material Fornecido pela parte Contratada',\n            materialLista: 'Placas Drywall RU e Perfis',\n            qtd: 35,\n            valUnit: 110.00,\n            subtotal: 3850.00,\n            obs: 'Forro rebaixado com cortineiro iluminado.'\n          }\n        ]\n      }\n    ];\n\n    const CLIENTES_DEMO_DEFAULT = [\n      { id: 'c1', nome: 'Marcos Vinicius Ribeiro', whats: '(11) 99887-7665', endereco: 'Rua das Palmeiras, 142 - Apto 31, Jardins' },\n      { id: 'c2', nome: 'Juliana Moreira', whats: '(11) 98123-4567', endereco: 'Av. Brasil, 850 - Casa 3' },\n      { id: 'c3', nome: 'Carlos Eduardo Silva', whats: '(11) 98765-4321', endereco: 'Av. Paulista, 1500 - Apto 42' }\n    ];\n\n    const TRANSACOES_DEMO_DEFAULT = [\n      {\n        id: '9901',\n        tipo: 'entrada',\n        data: new Date().toISOString().split('T')[0],\n        categoria: 'Sinal / Entrada',\n        valor: 3862.50,\n        cliente: 'Marcos Vinicius Ribeiro',\n        obs: '50% sinal ref. Orçamento Nº 0001',\n        orcamentoId: 101\n      },\n      {\n        id: '9902',\n        tipo: 'saida',\n        data: new Date().toISOString().split('T')[0],\n        categoria: 'Material de Construção',\n        valor: 920.00,\n        cliente: 'Marcos Vinicius Ribeiro',\n        obs: 'Tintas Suvinil e Argamassa ACIII'\n      },\n      {\n        id: '9903',\n        tipo: 'saida',\n        data: new Date().toISOString().split('T')[0],\n        categoria: 'Pagamento de Ajudante/Equipe',\n        valor: 450.00,\n        cliente: 'Marcos Vinicius Ribeiro',\n        obs: 'Diária dos ajudantes de pintura'\n      },\n      {\n        id: '9904',\n        tipo: 'entrada',\n        data: new Date().toISOString().split('T')[0],\n        categoria: 'Sinal / Entrada',\n        valor: 1540.00,\n        cliente: 'Juliana Moreira',\n        obs: 'Adiantamento material de gesso',\n        orcamentoId: 102\n      }\n    ];\n\n    // INICIALIZAÇÃO DE ESTADO\n    let perfil = JSON.parse(localStorage.getItem('orca_demo_perfil')) || PERFIL_DEMO_DEFAULT;\n    let orcamentos = JSON.parse(localStorage.getItem('orca_demo_orcamentos')) || ORCAMENTOS_DEMO_DEFAULT;\n    let clientesBD = JSON.parse(localStorage.getItem('orca_demo_clientes')) || CLIENTES_DEMO_DEFAULT;\n    let transacoes = JSON.parse(localStorage.getItem('orca_demo_transacoes')) || TRANSACOES_DEMO_DEFAULT;\n\n    function salvarEstado() {\n      localStorage.setItem('orca_demo_perfil', JSON.stringify(perfil));\n      localStorage.setItem('orca_demo_orcamentos', JSON.stringify(orcamentos));\n      localStorage.setItem('orca_demo_clientes', JSON.stringify(clientesBD));\n      localStorage.setItem('orca_demo_transacoes', JSON.stringify(transacoes));\n    }\n\n    let servicosContador = 0;\n\n    // INICIALIZAÇÃO GERAL AO CARREGAR\n    window.addEventListener('DOMContentLoaded', () => {\n      atualizarCabecalhoEmpresa();\n      carregarPerfilForm();\n      if (document.querySelectorAll('[id^=\"card-servico-\"]').length === 0) {\n        adicionarServico();\n      }\n      renderizarListaOrcamentos();\n      renderizarListaClientes();\n      mudarTempoFin('total');\n\n      // Inicia o Tour guiado suavemente\n      setTimeout(() => iniciarTour(1), 500);\n    });\n\n    // CABEÇALHO E PERFIL\n    function atualizarCabecalhoEmpresa() {\n      const img = document.getElementById('header-logo-img');\n      const box = document.getElementById('header-logo-container');\n      const nomeEl = document.getElementById('header-company-name');\n      if (perfil.logo) {\n        img.src = perfil.logo;\n        box.classList.remove('hidden');\n      } else {\n        box.classList.add('hidden');\n      }\n      if (nomeEl) nomeEl.innerText = perfil.nome || 'Sua Empresa';\n    }\n\n    function toggleModalPerfil() {\n      document.getElementById('modal-perfil').classList.toggle('hidden');\n    }\n\n    function abrirSeletorLogo() {\n      document.getElementById('input-logo-direto').click();\n    }\n\n    function carregarPerfilForm() {\n      document.getElementById('prof-nome').value = perfil.nome || '';\n      document.getElementById('prof-whats').value = perfil.whats || '';\n      document.getElementById('prof-doc').value = perfil.doc || '';\n      document.getElementById('prof-pix').value = perfil.pix || '';\n      document.getElementById('prof-pix-titular').value = perfil.pixTitular || '';\n      document.getElementById('prof-padrao-m2').value = perfil.m2 || '';\n      document.getElementById('prof-padrao-ponto').value = perfil.ponto || '';\n      document.getElementById('prof-padrao-diaria').value = perfil.diaria || '';\n      if (perfil.logo) {\n        document.getElementById('preview-logo-img').src = perfil.logo;\n      }\n    }\n\n    function carregarLogoEmBase64(event) {\n      const file = event.target.files[0];\n      if (!file) return;\n      const reader = new FileReader();\n      reader.onload = function(e) {\n        perfil.logo = e.target.result;\n        document.getElementById('preview-logo-img').src = perfil.logo;\n        atualizarCabecalhoEmpresa();\n        salvarEstado();\n        mostrarToast('✅ Seu Logo foi inserido com sucesso!');\n        // Se estiver no passo 1 do tour, avança automaticamente!\n        if (passoTourAtual === 1) {\n          setTimeout(() => proximoPassoTour(), 600);\n        }\n      };\n      reader.readAsDataURL(file);\n    }\n\n    function removerLogo() {\n      perfil.logo = LOGO_PADRAO_SVG;\n      document.getElementById('preview-logo-img').src = perfil.logo;\n      atualizarCabecalhoEmpresa();\n      salvarEstado();\n      mostrarToast('Logo padrão restaurado');\n    }\n\n    function salvarPerfil() {\n      perfil.nome = document.getElementById('prof-nome').value || 'Sua Empresa';\n      perfil.whats = document.getElementById('prof-whats').value;\n      perfil.doc = document.getElementById('prof-doc').value;\n      perfil.pix = document.getElementById('prof-pix').value;\n      perfil.pixTitular = document.getElementById('prof-pix-titular').value;\n      perfil.m2 = parseFloat(document.getElementById('prof-padrao-m2').value) || 0;\n      perfil.ponto = parseFloat(document.getElementById('prof-padrao-ponto').value) || 0;\n      perfil.diaria = parseFloat(document.getElementById('prof-padrao-diaria').value) || 0;\n      salvarEstado();\n      atualizarCabecalhoEmpresa();\n      toggleModalPerfil();\n      mostrarToast('✅ Perfil atualizado!');\n    }\n\n    // NAVEGAÇÃO DE ABAS\n    function mudarAba(aba) {\n      const abas = ['novo', 'lista', 'clientes', 'financeiro'];\n      abas.forEach(id => {\n        const btn = document.getElementById('tab-btn-' + id);\n        const sec = document.getElementById('aba-' + id);\n        if (id === aba) {\n          btn.className = \"flex-1 py-3 px-1 flex flex-col sm:flex-row items-center justify-center gap-1 border-b-2 border-blue-700 text-blue-700 bg-blue-50/60 transition\";\n          sec.classList.remove('hidden');\n        } else {\n          btn.className = \"flex-1 py-3 px-1 flex flex-col sm:flex-row items-center justify-center gap-1 border-b-2 border-transparent text-slate-500 hover:text-slate-700 transition\";\n          sec.classList.add('hidden');\n        }\n      });\n      if (aba === 'lista') renderizarListaOrcamentos();\n      if (aba === 'clientes') renderizarListaClientes();\n      if (aba === 'financeiro') {\n        renderizarListaClientes();\n        atualizarDashboardFinanceiro();\n      }\n    }\n\n    // GESTÃO DE SERVIÇOS\n    function adicionarServico() {\n      servicosContador++;\n      const id = servicosContador;\n      const container = document.getElementById('container-servicos');\n      const card = document.createElement('div');\n      card.id = `card-servico-${id}`;\n      card.className = \"bg-slate-50 p-3 rounded-xl border border-slate-300 relative space-y-2.5 shadow-sm text-xs\";\n      card.innerHTML = `\n        \u003cdiv class=\"flex justify-between items-center border-b border-slate-200 pb-1.5\">\n          \u003cspan class=\"font-bold text-blue-800 uppercase tracking-wide\">Item #${id}\u003c/span>\n          \u003cbutton onclick=\"removerServico(${id})\" class=\"text-[11px] text-red-600 hover:text-red-800 font-semibold\">\u003ci class=\"fa-solid fa-trash mr-1\">\u003c/i> Remover\u003c/button>\n        \u003c/div>\n        \u003cdiv class=\"grid grid-cols-1 sm:grid-cols-3 gap-2\">\n          \u003cdiv>\n            \u003clabel class=\"block font-semibold text-slate-600 mb-0.5\">Especialidade / Serviço\u003c/label>\n            \u003cselect id=\"serv-tipo-${id}\" class=\"w-full border rounded-xl p-2 bg-white outline-none\">\n              \u003coption value=\"Pintura\">Pintura\u003c/option>\n              \u003coption value=\"Cerâmica / Porcelanato\">Cerâmica / Porcelanato\u003c/option>\n              \u003coption value=\"Alvenaria / Bloco\">Alvenaria / Bloco\u003c/option>\n              \u003coption value=\"Elétrica\">Elétrica\u003c/option>\n              \u003coption value=\"Hidráulica\">Hidráulica\u003c/option>\n              \u003coption value=\"Gesso / Drywall\">Gesso / Drywall\u003c/option>\n              \u003coption value=\"Telhado / Cobertura\">Telhado / Cobertura\u003c/option>\n            \u003c/select>\n          \u003c/div>\n          \u003cdiv>\n            \u003clabel class=\"block font-semibold text-slate-600 mb-0.5\">Cobrança\u003c/label>\n            \u003cselect id=\"serv-cobranca-${id}\" onchange=\"alternarCamposCobranca(${id})\" class=\"w-full border rounded-xl p-2 bg-white outline-none\">\n              \u003coption value=\"m2\">Por Metro (m²)\u003c/option>\n              \u003coption value=\"diaria\">Por Diária\u003c/option>\n              \u003coption value=\"ponto\">Por Ponto\u003c/option>\n              \u003coption value=\"empreita\">Preço Fechado\u003c/option>\n            \u003c/select>\n          \u003c/div>\n          \u003cdiv>\n            \u003clabel class=\"block font-semibold text-slate-600 mb-0.5\">Materiais\u003c/label>\n            \u003cselect id=\"serv-mat-tipo-${id}\" class=\"w-full border rounded-xl p-2 bg-white outline-none\">\n              \u003coption value=\"Somente Mão de Obra\">Somente Mão de Obra\u003c/option>\n              \u003coption value=\"Material Fornecido pela parte Contratada\">Material Incluso\u003c/option>\n              \u003coption value=\"Materiais Fornecidos pela parte Contratante\">Material do Cliente\u003c/option>\n            \u003c/select>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"grid grid-cols-3 gap-2 bg-white p-2.5 rounded-xl border border-slate-200 items-center\">\n          \u003cdiv>\n            \u003clabel class=\"block text-[10px] text-slate-500 mb-0.5 font-semibold\">Qtd\u003c/label>\n            \u003cinput type=\"number\" id=\"serv-qtd-${id}\" oninput=\"calcularTotalGeral()\" value=\"1\" step=\"any\" class=\"w-full border rounded-lg p-1.5 text-xs font-bold text-center\">\n          \u003c/div>\n          \u003cdiv>\n            \u003clabel class=\"block text-[10px] text-slate-500 mb-0.5 font-semibold\">Valor Unit (R$)\u003c/label>\n            \u003cinput type=\"number\" id=\"serv-val-unit-${id}\" oninput=\"calcularTotalGeral()\" value=\"0\" step=\"any\" class=\"w-full border rounded-lg p-1.5 text-xs font-bold text-blue-900 text-center\">\n          \u003c/div>\n          \u003cdiv class=\"text-right\">\n            \u003cspan class=\"text-[9px] text-slate-400 font-bold block uppercase\">Subtotal\u003c/span>\n            \u003cspan id=\"serv-subtotal-${id}\" class=\"text-xs sm:text-sm font-black text-slate-800\">R$ 0,00\u003c/span>\n          \u003c/div>\n        \u003c/div>\n      `;\n      container.appendChild(card);\n      alternarCamposCobranca(id);\n      calcularTotalGeral();\n    }\n\n    function removerServico(id) {\n      const card = document.getElementById(`card-servico-${id}`);\n      if (card) {\n        card.remove();\n        calcularTotalGeral();\n      }\n    }\n\n    function alternarCamposCobranca(id) {\n      const cobranca = document.getElementById(`serv-cobranca-${id}`).value;\n      const unitInput = document.getElementById(`serv-val-unit-${id}`);\n      if (cobranca === 'm2' && perfil.m2) unitInput.value = perfil.m2;\n      else if (cobranca === 'ponto' && perfil.ponto) unitInput.value = perfil.ponto;\n      else if (cobranca === 'diaria' && perfil.diaria) unitInput.value = perfil.diaria;\n      calcularTotalGeral();\n    }\n\n    function calcularTotalGeral() {\n      let total = 0;\n      document.querySelectorAll('[id^=\"card-servico-\"]').forEach(card => {\n        const id = card.id.replace('card-servico-', '');\n        const qtd = parseFloat(document.getElementById(`serv-qtd-${id}`)?.value) || 0;\n        const valUnit = parseFloat(document.getElementById(`serv-val-unit-${id}`)?.value) || 0;\n        const subtotal = qtd * valUnit;\n        const subtotalEl = document.getElementById(`serv-subtotal-${id}`);\n        if (subtotalEl) {\n          subtotalEl.innerText = subtotal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });\n        }\n        total += subtotal;\n      });\n      document.getElementById('valor-total-geral').innerText = total.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });\n      return total;\n    }\n\n    function toggleCampoResponsavel() {\n      const box = document.getElementById('box-responsavel');\n      const lbl = document.getElementById('lbl-btn-responsavel');\n      if (box.classList.contains('hidden')) {\n        box.classList.remove('hidden');\n        lbl.innerText = 'Remover Responsável Técnico';\n      } else {\n        box.classList.add('hidden');\n        lbl.innerText = 'Adicionar Responsável Técnico / Mestre de Obras';\n        document.getElementById('cond-responsavel').value = '';\n      }\n    }\n\n    // SALVAR ORÇAMENTO E ABRIR PRÉVIA\n    function salvarOrcamento() {\n      const cliNome = document.getElementById('cli-nome').value.trim() || 'Cliente de Demonstração';\n      const listaServicos = [];\n      document.querySelectorAll('[id^=\"card-servico-\"]').forEach(card => {\n        const id = card.id.replace('card-servico-', '');\n        const qtd = parseFloat(document.getElementById(`serv-qtd-${id}`).value) || 0;\n        const valUnit = parseFloat(document.getElementById(`serv-val-unit-${id}`).value) || 0;\n        listaServicos.push({\n          tipo: document.getElementById(`serv-tipo-${id}`).value,\n          cobranca: document.getElementById(`serv-cobranca-${id}`).value,\n          materialTipo: document.getElementById(`serv-mat-tipo-${id}`).value,\n          qtd: qtd,\n          valUnit: valUnit,\n          subtotal: qtd * valUnit\n        });\n      });\n\n      const proxNumero = orcamentos.length > 0 ? Math.max(...orcamentos.map(o => parseInt(o.numero) || 0)) + 1 : 1;\n      const novoOrc = {\n        id: Date.now(),\n        numero: proxNumero,\n        data: new Date().toLocaleDateString('pt-BR'),\n        cliente: {\n          nome: cliNome,\n          whats: document.getElementById('cli-whats').value.trim() || '(11) 98765-4321',\n          endereco: document.getElementById('cli-endereco').value.trim() || 'São Paulo/SP'\n        },\n        responsavel: document.getElementById('cond-responsavel').value.trim(),\n        servicos: listaServicos.length > 0 ? listaServicos : [{ tipo: 'Reforma e Acabamento', cobranca: 'empreita', materialTipo: 'Material Incluso', qtd: 1, valUnit: 3500, subtotal: 3500 }],\n        condicoes: {\n          prazo: document.getElementById('cond-prazo').value,\n          pagto: document.getElementById('cond-pagto').value,\n          validade: document.getElementById('cond-validade').value,\n          garantia: document.getElementById('cond-garantia').value\n        },\n        totalGeral: calcularTotalGeral() || 3500,\n        status: 'Pendente',\n        ocultarValores: document.getElementById('ocultar-valores').checked\n      };\n\n      orcamentos.unshift(novoOrc);\n      salvarEstado();\n      renderizarListaOrcamentos();\n\n      // Abre a prévia do documento\n      mostrarPreviaOrcamento(novoOrc.id);\n      mostrarToast('🎉 Orçamento gerado com sucesso!');\n    }\n\n    // HISTÓRICO\n    function renderizarListaOrcamentos() {\n      const container = document.getElementById('lista-orcamentos-container');\n      const termoBusca = (document.getElementById('busca-orcamento')?.value || '').toLowerCase().trim();\n      const filtroStatus = document.getElementById('filtro-status-orc')?.value || 'todos';\n\n      const filtrados = orcamentos.filter(item => {\n        if (filtroStatus !== 'todos' && item.status !== filtroStatus) return false;\n        if (termoBusca) {\n          const nomeOK = item.cliente.nome.toLowerCase().includes(termoBusca);\n          const numOK = String(item.numero || '').includes(termoBusca);\n          if (!nomeOK && !numOK) return false;\n        }\n        return true;\n      });\n\n      document.getElementById('qtd-orcamentos').innerText = filtrados.length;\n      if (filtrados.length === 0) {\n        container.innerHTML = `\u003cp class=\"text-center text-slate-400 py-6 text-xs\">Nenhum orçamento encontrado.\u003c/p>`;\n        return;\n      }\n\n      container.innerHTML = filtrados.map(item => `\n        \u003cdiv class=\"bg-slate-50 p-3 rounded-xl border border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2.5 text-xs\">\n          \u003cdiv>\n            \u003cdiv class=\"flex items-center gap-1.5 flex-wrap\">\n              \u003cspan class=\"font-bold text-slate-800\">${item.cliente.nome}\u003c/span>\n              \u003cspan class=\"text-[9px] font-bold bg-blue-100 text-blue-800 px-2 py-0.5 rounded-full\">Nº ${String(item.numero || 0).padStart(4, '0')}\u003c/span>\n              \u003cspan class=\"text-[10px] text-slate-400\">${item.data}\u003c/span>\n            \u003c/div>\n            \u003cp class=\"text-[11px] font-bold text-blue-900 mt-0.5\">Total: ${item.totalGeral.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"flex items-center gap-1.5 w-full sm:w-auto justify-end\">\n            \u003cbutton onclick=\"mostrarPreviaOrcamento(${item.id})\" class=\"bg-blue-700 hover:bg-blue-800 text-white font-bold px-2.5 py-1.5 rounded-lg flex items-center gap-1 shadow-sm\">\n              \u003ci class=\"fa-solid fa-file-pdf\">\u003c/i> Ver Orçamento\n            \u003c/button>\n            \u003cbutton onclick=\"abrirModalEditarContrato(${item.id})\" class=\"bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-2.5 py-1.5 rounded-lg flex items-center gap-1 shadow-sm\">\n              \u003ci class=\"fa-solid fa-file-contract\">\u003c/i> Contrato\n            \u003c/button>\n          \u003c/div>\n        \u003c/div>\n      `).join('');\n    }\n\n    // MODAL DE PRÉVIA DE DOCUMENTOS\n    function abrirPreviaDocumento(titulo, htmlConteudo, tipoDoc = '') {\n      document.getElementById('preview-doc-title').innerHTML = titulo;\n      document.getElementById('preview-doc-content').innerHTML = htmlConteudo;\n\n      const footerMsg = document.getElementById('preview-doc-footer-msg');\n      const footerSub = document.getElementById('preview-doc-footer-sub');\n      const nextBtn = document.getElementById('preview-doc-next-tour-btn');\n      const nextText = document.getElementById('preview-doc-next-tour-text');\n\n      if (passoTourAtual === 4 && (tipoDoc === 'orcamento' || !tipoDoc)) {\n        footerMsg.innerHTML = '\u003cspan class=\"text-amber-300 font-extrabold\">✨ Proposta Gerada!\u003c/span> Veja o Contrato no Passo 5.';\n        if (footerSub) footerSub.innerHTML = '\u003ci class=\"fa-solid fa-file-pdf text-amber-300 mr-1\">\u003c/i>No app completo, o arquivo é baixado em PDF ou enviado direto para o WhatsApp do cliente.';\n        nextText.innerText = 'Ver Contrato';\n        nextBtn.classList.remove('hidden');\n      } else if (passoTourAtual === 5 && tipoDoc === 'contrato') {\n        footerMsg.innerHTML = '\u003cspan class=\"text-indigo-300 font-extrabold\">📜 Contrato Pronto!\u003c/span> Veja os Recibos no Passo 6.';\n        if (footerSub) footerSub.innerHTML = '\u003ci class=\"fa-solid fa-file-signature text-indigo-300 mr-1\">\u003c/i>No app completo, o contrato é baixado em PDF com cláusulas e garantia técnica.';\n        nextText.innerText = 'Ver Recibos';\n        nextBtn.classList.remove('hidden');\n      } else if (passoTourAtual === 6 && tipoDoc === 'recibo') {\n        footerMsg.innerHTML = '\u003cspan class=\"text-green-300 font-extrabold\">🧾 Recibo Formal!\u003c/span> Com valor por extenso pronto.';\n        if (footerSub) footerSub.innerHTML = '\u003ci class=\"fa-solid fa-receipt text-green-300 mr-1\">\u003c/i>No app completo, o recibo em PDF é gerado e enviado na hora para o cliente.';\n        nextText.innerText = 'Finalizar Tour';\n        nextBtn.classList.remove('hidden');\n      } else {\n        footerMsg.innerText = 'Documento pronto para envio formal.';\n        if (footerSub) footerSub.innerHTML = '\u003ci class=\"fa-solid fa-file-pdf text-amber-300 mr-1\">\u003c/i>No app completo, este documento é baixado em PDF ou enviado direto ao cliente.';\n        nextBtn.classList.add('hidden');\n      }\n\n      document.getElementById('modal-doc-preview').classList.remove('hidden');\n    }\n\n    function fecharPreviaDocumento() {\n      document.getElementById('modal-doc-preview').classList.add('hidden');\n    }\n\n    function avancarDoDocumentoParaProximoPasso() {\n      fecharPreviaDocumento();\n      proximoPassoTour();\n    }\n\n    function popularTemplatePDF(orcamento) {\n      const logoBox = document.getElementById('pdf-logo-container');\n      const logoImg = document.getElementById('pdf-logo-img');\n      if (perfil.logo) {\n        logoImg.src = perfil.logo;\n        logoBox.classList.remove('hidden');\n      } else {\n        logoBox.classList.add('hidden');\n      }\n\n      document.getElementById('pdf-prof-nome').innerText = perfil.nome || 'Sua Empresa';\n      document.getElementById('pdf-prof-doc').innerText = perfil.doc ? `Doc: ${perfil.doc}` : '';\n      document.getElementById('pdf-prof-whats').innerText = perfil.whats ? `WhatsApp: ${perfil.whats}` : '';\n      document.getElementById('pdf-prof-pix').innerText = perfil.pix || 'A combinar';\n      document.getElementById('pdf-data').innerText = `Data: ${orcamento.data} • Nº ${String(orcamento.numero || 0).padStart(4, '0')}`;\n      document.getElementById('pdf-cli-nome').innerText = orcamento.cliente.nome;\n      document.getElementById('pdf-cli-whats').innerText = orcamento.cliente.whats;\n      document.getElementById('pdf-cli-endereco').innerText = orcamento.cliente.endereco || 'São Paulo/SP';\n\n      const tbody = document.getElementById('pdf-tbody-servicos');\n      tbody.innerHTML = orcamento.servicos.map(s => `\n        \u003cdiv class=\"p-2 sm:p-2.5 bg-slate-50 rounded-xl border border-slate-200/80 flex items-center justify-between gap-2\">\n          \u003cdiv class=\"min-w-0 flex-1\">\n            \u003cdiv class=\"flex items-center gap-1.5 flex-wrap\">\n              \u003cspan class=\"font-bold text-slate-900 text-xs sm:text-[13px]\">${s.tipo}\u003c/span>\n              \u003cspan class=\"text-[9px] font-semibold bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded\">${s.materialTipo}\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"text-[10px] text-slate-500 mt-0.5\">\n              \u003cspan>Qtd: \u003cstrong>${s.qtd}\u003c/strong>\u003c/span> • \u003cspan>Unitário: \u003cstrong>R$ ${Number(s.valUnit).toFixed(2).replace('.', ',')}\u003c/strong>\u003c/span>\n            \u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"text-right shrink-0\">\n            \u003cspan class=\"text-xs sm:text-sm font-black text-blue-900\">${orcamento.ocultarValores ? '—' : s.subtotal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}\u003c/span>\n          \u003c/div>\n        \u003c/div>\n      `).join('');\n\n      document.getElementById('pdf-cond-prazo').innerText = orcamento.condicoes.prazo || '10 dias úteis';\n      document.getElementById('pdf-cond-pagto').innerText = orcamento.condicoes.pagto || '50% sinal e 50% entrega';\n      document.getElementById('pdf-cond-validade').innerText = orcamento.condicoes.validade || '15 dias';\n      document.getElementById('pdf-valor-final').innerText = orcamento.totalGeral.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });\n      document.getElementById('pdf-footer-garantia').innerHTML = `\u003ci class=\"fa-solid fa-shield-halved text-green-600\">\u003c/i> Garantia formal de ${orcamento.condicoes.garantia || '90 dias'} sobre a mão de obra executada.`;\n    }\n\n    function mostrarPreviaOrcamento(id) {\n      const orc = orcamentos.find(o => o.id === id);\n      if (!orc) return;\n      popularTemplatePDF(orc);\n      abrirPreviaDocumento(\n        `\u003ci class=\"fa-solid fa-file-invoice text-blue-300\">\u003c/i> Orçamento Nº ${String(orc.numero || 0).padStart(4, '0')}`,\n        document.getElementById('pdf-template').innerHTML,\n        'orcamento'\n      );\n    }\n\n    // CONTRATO\n    function abrirModalEditarContrato(id) {\n      const orc = orcamentos.find(o => o.id === id);\n      if (!orc) return;\n      document.getElementById('edit-ctr-id').value = id;\n      document.getElementById('edit-ctr-c1').value = `Objeto referente ao Orçamento Nº ${String(orc.numero || 0).padStart(4, '0')}, para execução de serviços de reforma e alvenaria no imóvel informado.`;\n      document.getElementById('edit-ctr-c2').value = `O fornecimento de materiais segue o discriminado na proposta técnica.`;\n      document.getElementById('edit-ctr-c3').value = `Prazo de execução estipulado em ${orc.condicoes.prazo || '15 dias úteis'}.`;\n      document.getElementById('edit-ctr-c4').value = `Valor total: ${orc.totalGeral.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}. Pagamento: ${orc.condicoes.pagto}.`;\n      document.getElementById('modal-editar-contrato').classList.remove('hidden');\n    }\n\n    function fecharModalContrato() {\n      document.getElementById('modal-editar-contrato').classList.add('hidden');\n    }\n\n    function confirmarEGerarPDFContrato() {\n      const id = parseInt(document.getElementById('edit-ctr-id').value);\n      const orc = orcamentos.find(o => o.id === id);\n      if (!orc) return;\n\n      const logoBox = document.getElementById('contrato-logo-container');\n      const logoImg = document.getElementById('contrato-logo-img');\n      if (perfil.logo) {\n        logoImg.src = perfil.logo;\n        logoBox.classList.remove('hidden');\n      } else {\n        logoBox.classList.add('hidden');\n      }\n\n      document.getElementById('ctr-prof-nome').innerText = perfil.nome || 'Prestador';\n      document.getElementById('ctr-prof-doc').innerText = perfil.doc || 'Não informado';\n      document.getElementById('ctr-cli-nome').innerText = orc.cliente.nome;\n      document.getElementById('ctr-cli-whats').innerText = orc.cliente.whats;\n      document.getElementById('out-ctr-c1').innerText = document.getElementById('edit-ctr-c1').value;\n      document.getElementById('out-ctr-c2').innerText = document.getElementById('edit-ctr-c2').value;\n      document.getElementById('out-ctr-c3').innerText = document.getElementById('edit-ctr-c3').value;\n      document.getElementById('out-ctr-c4').innerText = document.getElementById('edit-ctr-c4').value;\n      document.getElementById('ctr-pix').innerText = perfil.pix || 'A combinar';\n      document.getElementById('ctr-pix-titular').innerText = perfil.pixTitular || '';\n      document.getElementById('ctr-ass-cli').innerText = orc.cliente.nome;\n      document.getElementById('ctr-ass-prof').innerText = perfil.nome || 'CONTRATADA';\n      document.getElementById('out-ctr-garantia').innerText = `Garantia legal de ${orc.condicoes.garantia || '90 dias'} a contar da data de entrega.`;\n\n      fecharModalContrato();\n      abrirPreviaDocumento(\n        `\u003ci class=\"fa-solid fa-file-signature text-indigo-300\">\u003c/i> Contrato - ${orc.cliente.nome}`,\n        document.getElementById('contrato-template').innerHTML,\n        'contrato'\n      );\n    }\n\n    // RECIBO DE PAGAMENTO COM VALOR POR EXTENSO\n    function valorPorExtenso(valor) {\n      const unidades = ['', 'um', 'dois', 'três', 'quatro', 'cinco', 'seis', 'sete', 'oito', 'nove'];\n      const dez_a_dezenove = ['dez', 'onze', 'doze', 'treze', 'quatorze', 'quinze', 'dezesseis', 'dezessete', 'dezoito', 'dezenove'];\n      const dezenas = ['', '', 'vinte', 'trinta', 'quarenta', 'cinquenta', 'sessenta', 'setenta', 'oitenta', 'noventa'];\n      const centenas = ['', 'cento', 'duzentos', 'trezentos', 'quatrocentos', 'quinhentos', 'seiscentos', 'setecentos', 'oitocentos', 'novecentos'];\n\n      function extensoAte999(n) {\n        if (n === 0) return '';\n        if (n === 100) return 'cem';\n        let partes = [];\n        const c = Math.floor(n / 100);\n        const resto = n % 100;\n        if (c > 0) partes.push(centenas[c]);\n        if (resto >= 10 && resto \u003c 20) partes.push(dez_a_dezenove[resto - 10]);\n        else {\n          const d = Math.floor(resto / 10);\n          const u = resto % 10;\n          if (d > 0) partes.push(dezenas[d]);\n          if (u > 0) partes.push(unidades[u]);\n        }\n        return partes.filter(Boolean).join(' e ');\n      }\n\n      const reais = Math.floor(valor);\n      const centavos = Math.round((valor - reais) * 100);\n      let texto = '';\n      if (reais === 0) texto = 'zero reais';\n      else if (reais === 1) texto = 'um real';\n      else {\n        const milhares = Math.floor(reais / 1000);\n        const resto = reais % 1000;\n        let partes = [];\n        if (milhares > 0) partes.push(milhares === 1 ? 'mil' : extensoAte999(milhares) + ' mil');\n        if (resto > 0) partes.push(extensoAte999(resto));\n        texto = partes.join(' e ') + ' reais';\n      }\n      if (centavos > 0) {\n        texto += ' e ' + extensoAte999(centavos) + (centavos === 1 ? ' centavo' : ' centavos');\n      }\n      return texto.charAt(0).toUpperCase() + texto.slice(1);\n    }\n\n    function gerarRecibo(idTransacao) {\n      const trans = transacoes.find(t => String(t.id) === String(idTransacao));\n      if (!trans || trans.tipo !== 'entrada') {\n        alert('Recibos só podem ser emitidos para entradas financeiras.');\n        return;\n      }\n\n      const logoBox = document.getElementById('recibo-logo-container');\n      const logoImg = document.getElementById('recibo-logo-img');\n      if (perfil.logo) {\n        logoImg.src = perfil.logo;\n        logoBox.classList.remove('hidden');\n      } else {\n        logoBox.classList.add('hidden');\n      }\n\n      document.getElementById('recibo-prof-nome').innerText = perfil.nome || 'Prestador';\n      document.getElementById('recibo-prof-doc').innerText = perfil.doc ? `Doc: ${perfil.doc}` : '';\n      document.getElementById('recibo-numero').innerText = String(trans.id).padStart(6, '0');\n      document.getElementById('recibo-data-emissao').innerText = new Date().toLocaleDateString('pt-BR');\n\n      const valor = parseFloat(trans.valor) || 0;\n      document.getElementById('recibo-valor').innerText = valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });\n      document.getElementById('recibo-valor-extenso').innerText = '(' + valorPorExtenso(valor) + ')';\n\n      const nomeCliente = trans.cliente || 'Cliente';\n      document.getElementById('recibo-cli-nome').innerText = nomeCliente;\n      document.getElementById('recibo-cli-whats').innerText = '(11) 98765-4321';\n      document.getElementById('recibo-categoria').innerText = trans.categoria || 'Serviços Prestados';\n      document.getElementById('recibo-descricao').innerText = trans.obs || 'Pagamento referente à etapa acordada.';\n\n      document.getElementById('recibo-data-recebimento').innerText = new Date().toLocaleDateString('pt-BR');\n      document.getElementById('recibo-pix').innerText = perfil.pix || 'A combinar';\n      document.getElementById('recibo-pix-titular').innerText = perfil.pixTitular || '';\n      document.getElementById('recibo-ass-recebedor').innerText = perfil.nome || 'Recebedor';\n      document.getElementById('recibo-ass-cliente').innerText = nomeCliente;\n\n      abrirPreviaDocumento(\n        `\u003ci class=\"fa-solid fa-receipt text-green-300\">\u003c/i> Recibo de Pagamento - ${nomeCliente}`,\n        document.getElementById('recibo-template').innerHTML,\n        'recibo'\n      );\n    }\n\n    // DASHBOARD FINANCEIRO\n    let pieChartFinanceiroInst = null;\n    let barChartFinanceiroInst = null;\n\n    function mudarTempoFin(tempo) {\n      atualizarDashboardFinanceiro();\n    }\n\n    function atualizarDashboardFinanceiro() {\n      let ent = 0, sai = 0;\n      let htmlLista = '';\n      const mapaPizza = new Map();\n      const mapaBarra = new Map();\n\n      transacoes.forEach(t => {\n        const val = parseFloat(t.valor) || 0;\n        if (t.tipo === 'entrada') ent += val;\n        else sai += val;\n\n        const chavePie = t.categoria;\n        const dadosCat = mapaPizza.get(chavePie) || { valor: 0, tipo: t.tipo };\n        dadosCat.valor += val;\n        mapaPizza.set(chavePie, dadosCat);\n\n        const dataFormatada = new Date().toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' });\n        const saldoData = mapaBarra.get(dataFormatada) || 0;\n        mapaBarra.set(dataFormatada, saldoData + (t.tipo === 'entrada' ? val : -val));\n\n        const corIcon = t.tipo === 'entrada' ? 'text-green-600 fa-arrow-down' : 'text-red-600 fa-arrow-up';\n        const corVal = t.tipo === 'entrada' ? 'text-green-700' : 'text-red-700';\n        const sinal = t.tipo === 'entrada' ? '+' : '-';\n\n        htmlLista += `\n          \u003cdiv class=\"flex justify-between items-center p-2.5 bg-slate-50 rounded-xl border border-slate-200 text-xs\">\n            \u003cdiv class=\"flex items-center gap-2.5 min-w-0\">\n              \u003cdiv class=\"w-7 h-7 rounded-full bg-white flex items-center justify-center shadow-sm shrink-0\">\u003ci class=\"fa-solid ${corIcon} text-[10px]\">\u003c/i>\u003c/div>\n              \u003cdiv class=\"truncate\">\n                \u003cp class=\"font-bold text-slate-800 truncate\">${t.categoria}\u003c/p>\n                \u003cp class=\"text-[10px] text-slate-500 truncate\">${t.cliente ? `👤 ${t.cliente} | ` : ''}${t.obs || ''}\u003c/p>\n              \u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"text-right shrink-0\">\n              \u003cp class=\"font-bold ${corVal}\">${sinal} ${val.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}\u003c/p>\n              ${t.tipo === 'entrada' ? `\u003cbutton onclick=\"gerarRecibo('${t.id}')\" class=\"text-[10px] font-bold text-blue-700 hover:text-blue-900 bg-blue-50 px-2 py-0.5 rounded border border-blue-200 mt-0.5\">\u003ci class=\"fa-solid fa-receipt mr-0.5\">\u003c/i>Recibo\u003c/button>` : ''}\n            \u003c/div>\n          \u003c/div>\n        `;\n      });\n\n      document.getElementById('fin-entradas').innerText = ent.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });\n      document.getElementById('fin-saidas').innerText = sai.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });\n      document.getElementById('fin-saldo-caixa').innerText = (ent - sai).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });\n      document.getElementById('lista-transacoes-container').innerHTML = htmlLista;\n\n      desenharGraficosFinanceiros(mapaPizza, mapaBarra);\n    }\n\n    function desenharGraficosFinanceiros(mapaPizza, mapaBarra) {\n      const ctxPie = document.getElementById('pieChartFinanceiro');\n      const ctxBar = document.getElementById('barChartFinanceiro');\n      if (!ctxPie || !ctxBar) return;\n\n      const labelsPie = Array.from(mapaPizza.keys());\n      const valoresPie = labelsPie.map(k => mapaPizza.get(k).valor);\n      const bgColors = ['#1e3a8a', '#10b981', '#f59e0b', '#ef4444', '#6366f1'];\n\n      if (pieChartFinanceiroInst) pieChartFinanceiroInst.destroy();\n      pieChartFinanceiroInst = new Chart(ctxPie, {\n        type: 'doughnut',\n        data: {\n          labels: labelsPie,\n          datasets: [{ data: valoresPie, backgroundColor: bgColors }]\n        },\n        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 8, font: { size: 9 } } } }, cutout: '65%' }\n      });\n\n      const labelsBar = Array.from(mapaBarra.keys());\n      const valoresBar = labelsBar.map(k => mapaBarra.get(k));\n\n      if (barChartFinanceiroInst) barChartFinanceiroInst.destroy();\n      barChartFinanceiroInst = new Chart(ctxBar, {\n        type: 'bar',\n        data: {\n          labels: labelsBar,\n          datasets: [{ label: 'Saldo', data: valoresBar, backgroundColor: ['#22c55e', '#3b82f6'], borderRadius: 4 }]\n        },\n        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }\n      });\n    }\n\n    function abrirModalTransacao(tipo) {\n      document.getElementById('modal-nova-transacao').classList.remove('hidden');\n      document.getElementById('trans-tipo').value = tipo;\n      document.getElementById('titulo-modal-transacao').innerHTML = tipo === 'entrada' ? '\u003ci class=\"fa-solid fa-arrow-down text-green-600\">\u003c/i> Nova Entrada' : '\u003ci class=\"fa-solid fa-arrow-up text-red-600\">\u003c/i> Nova Saída';\n      const catSelect = document.getElementById('trans-categoria');\n      if (tipo === 'entrada') {\n        catSelect.innerHTML = `\u003coption value=\"Sinal / Entrada\">Sinal / Entrada\u003c/option>\u003coption value=\"Parcela\">Parcela\u003c/option>\u003coption value=\"Serviço Fechado\">Serviço Fechado\u003c/option>`;\n      } else {\n        catSelect.innerHTML = `\u003coption value=\"Material de Construção\">Material de Construção\u003c/option>\u003coption value=\"Pagamento de Ajudante\">Pagamento Equipe\u003c/option>\u003coption value=\"Ferramentas\">Ferramentas\u003c/option>`;\n      }\n      document.getElementById('trans-data').value = new Date().toISOString().split('T')[0];\n    }\n\n    function salvarTransacao(e) {\n      e.preventDefault();\n      transacoes.unshift({\n        id: String(Date.now()).slice(-6),\n        tipo: document.getElementById('trans-tipo').value,\n        data: document.getElementById('trans-data').value,\n        categoria: document.getElementById('trans-categoria').value,\n        valor: parseFloat(document.getElementById('trans-valor').value) || 0,\n        cliente: document.getElementById('trans-cliente').value,\n        obs: document.getElementById('trans-obs').value || ''\n      });\n      salvarEstado();\n      fecharModaisFinanceiro();\n      atualizarDashboardFinanceiro();\n      mostrarToast('✅ Lançamento registrado!');\n    }\n\n    function gerarPDFFinanceiro() {\n      let ent = 0, sai = 0;\n      let linhas = transacoes.map(t => {\n        const v = parseFloat(t.valor) || 0;\n        if (t.tipo === 'entrada') ent += v; else sai += v;\n        return `\n          \u003ctr class=\"border-b\">\n            \u003ctd class=\"p-1.5\">${t.data}\u003c/td>\n            \u003ctd class=\"p-1.5 font-bold ${t.tipo === 'entrada' ? 'text-green-700' : 'text-red-700'}\">${t.tipo === 'entrada' ? 'Entrada' : 'Saída'}\u003c/td>\n            \u003ctd class=\"p-1.5\">${t.categoria}\u003c/td>\n            \u003ctd class=\"p-1.5\">${t.cliente || '-'}\u003c/td>\n            \u003ctd class=\"p-1.5 text-right font-black\">${v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}\u003c/td>\n          \u003c/tr>\n        `;\n      }).join('');\n\n      const html = `\n        \u003cdiv class=\"space-y-3 text-xs\">\n          \u003cdiv class=\"border-b pb-2 flex justify-between items-center\">\n            \u003cdiv>\n              \u003ch2 class=\"text-sm font-black text-slate-800\">Relatório Financeiro da Obra\u003c/h2>\n              \u003cp class=\"text-[10px] text-slate-500\">${perfil.nome || 'Sua Empresa'}\u003c/p>\n            \u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"grid grid-cols-3 gap-2 bg-slate-100 p-2.5 rounded-xl border text-center\">\n            \u003cdiv>\u003cspan class=\"text-[9px] text-slate-500 uppercase font-bold\">Entradas\u003c/span>\u003cp class=\"text-xs font-black text-green-700\">${ent.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}\u003c/p>\u003c/div>\n            \u003cdiv>\u003cspan class=\"text-[9px] text-slate-500 uppercase font-bold\">Saídas\u003c/span>\u003cp class=\"text-xs font-black text-red-700\">${sai.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}\u003c/p>\u003c/div>\n            \u003cdiv>\u003cspan class=\"text-[9px] text-slate-500 uppercase font-bold\">Lucro\u003c/span>\u003cp class=\"text-xs font-black text-blue-900\">${(ent - sai).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}\u003c/p>\u003c/div>\n          \u003c/div>\n          \u003ctable class=\"w-full text-left border-collapse text-[11px]\">\n            \u003cthead>\n              \u003ctr class=\"bg-slate-200 text-slate-700 uppercase text-[9px]\">\n   toast = document.createElement('div');\n        toast.id = 'app-toast';\n        toast.className = 'fixed top-3 left-1/2 transform -translate-x-1/2 z-50 bg-slate-900 text-amber-300 font-bold px-3.5 py-2 rounded-xl shadow-xl text-xs flex items-center gap-1.5 border border-amber-400 transition-all duration-300 opacity-0 pointer-events-none max-w-[90vw] text-center';\n        document.body.appendChild(toast);\n      }\n      toast.innerHTML = mensagem;\n      toast.classList.remove('opacity-0', 'pointer-events-none');\n      setTimeout(() => {\n        toast.classList.add('opacity-0', 'pointer-events-none');\n      }, 2500);\n    }\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"},{"id":"b_1793326319236","type":"delay_button","delaySeconds":6,"text":"Quero Acessar o App Agora!","url":"","buttonSize":"normal"}]},{"id":"step_1793149536652","title":"Etapa 11","blocks":[{"id":"b_1793149541439","type":"heading","tag":"Seu Acesso Profissional Está Liberado","title":"Pare de Perder Dinheiro na Próxima Visita ","subtitle":"","delaySeconds":0},{"id":"b_1793149543268","type":"video","youtubeUrl":"https://youtu.be/l0LFKcmHswk","orientation":"horizontal","delaySeconds":0},{"id":"b_1793230400694","type":"heading","delaySeconds":30,"tag":"O QUE VOCÊ VAI RECEBER HOJE:","title":"","subtitle":"","align":"center","titleSize":"md","subtitleSize":"base"},{"id":"b_1793230188635","type":"heading","delaySeconds":30,"tag":"","title":"","subtitle":"✔ Módulo 1: Gerador de Orçamento Executivo em PDF   \n✔ Módulo 2: Contrato Anticalote em 1 Toque\n ✔ Módulo 3: Emissor de Recibos Profissionais Instantâneos   \n✔ Módulo 4: Painel Financeiro e Caixa de Obra Descomplicado   \n✔ Módulo 5: Assistente de Cobrança Educada via WhatsApp","align":"left","subtitleSize":"base","textColor":"#fb1313"},{"id":"b_1793327010494","type":"heading","delaySeconds":30,"tag":"De: R$ 97,00","title":"  Por apenas: R$ 19,90 / mês  \n(Menos que um saco de cimento)\n","subtitle":"","align":"center","titleSize":"sm","subtitl     const QuizApp = {

      init() {
        this.sessionId = this.getOrCreateSessionId();
        this.utmParams = this.captureUtms();
        const startStep = (typeof window.QUIZ_INITIAL_STEP === 'number' && window.QUIZ_INITIAL_STEP < this.config.steps.length) ? window.QUIZ_INITIAL_STEP : 0;
        this.renderStep(startStep);

      getOrCreateSessionId() {
        try {
          let sid = sessionStorage.getItem('q_session_id');
          if (!sid) {
            sid = 's_' + Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 6);
            sessionStorage.setItem('q_session_id', sid);

        } catch (e) {
          return 's_' + Date.now().toString(36);

      },

      captureUtms() {
        const utms = {};
        try {
          const params = new URLSearchParams(window.location.search);
          for (const [key, value] of params.entries()) {
            utms[key] = value;
          }
        } catch (e) {}
        return utms;
      },

      appendUtmsToUrl(url) {
        if (!url || url === '#' || url.startsWith('javascript:')) return url;
        if (!this.utmParams || Object.keys(this.utmParams).length === 0) return url;
        try {
          const isFull = url.startsWith('http://') || url.startsWith('https://');
          const base = isFull ? url : window.location.origin + (url.startsWith('/') ? url : '/' + url);
          const u = new URL(base);
          for (const [k, v] of Object.entries(this.utmParams)) {
            if (!u.searchParams.has(k)) {
              u.searchParams.set(k, v);
            }
          }
          return isFull ? u.toString() : (u.pathname + u.search + u.hash);
        } catch (e) {
          const sep = url.includes('?') ? '&' : '?';
          const qs = new URLSearchParams(this.utmParams).toString();
          return qs ? (url + sep + qs) : url;
        }
      },

      applyUtmsToLinks() {
        if (!this.utmParams || Object.keys(this.utmParams).length === 0) return;
        const links = document.querySelectorAll('.link-trackable, .cta-btn[href], .offer-container a[href]');
        links.forEach(link => {
          const href = link.getAttribute('href');
          if (href && href !== '#' && !href.startsWith('javascript:')) {

      calculateProgress(index, totalSteps) {
        if (totalSteps <= 0) return 0;
        const theme = this.config.theme || {};
        const rawStart = theme.startPercent !== undefined ? theme.startPercent : 60;
        const startPercent = Math.max(0, Math.min(95, parseInt(rawStart, 10) || 0));
        if (startPercent <= 0) {
          return Math.min(100, Math.round(((index + 1) / totalSteps) * 100));
        }
        const hideUntilClick = theme.hideUntilFirstClick !== false;
        const firstVisibleStep = hideUntilClick ? 1 : 0;

        if (totalSteps <= 1 || index >= totalSteps - 1) return 100;
        if (index <= firstVisibleStep) {
          return startPercent;
        }

        const remainingSteps = (totalSteps - 1) - firstVisibleStep;
        if (remainingSteps <= 0) return 100;

        const factor = (index - firstVisibleStep) / remainingSteps;
        const pct = Math.round(startPercent + ((100 - startPercent) * factor));
        return Math.min(100, Math.max(startPercent, pct));
      },

        const format = theme.progressTextFormat || 'full';
        switch (format) {

          case 'none': return '';
          case 'full':
          default: return 'Etapa ' + (index + 1) + ' de ' + totalSteps;

        const progressBar = document.getElementById('progress-bar');
        const progressPercent = document.getElementById('progress-percent');
        const stepIndicator = document.getElementById('step-indicator');
        const progressSection = document.getElementById('progress-section');

        const theme = this.config.theme || {};
        const showProgress = (theme.showProgressBar !== false);
        const hideUntilClick = (theme.hideUntilFirstClick !== false);
        const hasInteracted = this.hasAnswered || (index > 0) || (Object.keys(this.userAnswers || {}).length > 0);

        if (progressSection) {
          progressSection.style.display = (showProgress && (!hideUntilClick || hasInteracted)) ? 'block' : 'none';
        }

        const format = theme.progressTextFormat || 'full';
        const progressTextWrapper = progressSection ? progressSection.querySelector('.progress-text') : null;
        if (progressTextWrapper) {
          progressTextWrapper.style.display = format === 'none' ? 'none' : 'flex';
        }

        if (progressBar) progressBar.style.width = percent + '%';
        if (progressPercent) {
          if (format === 'none' || format === 'simple') {
            progressPercent.style.display = 'none';
          } else {
            progressPercent.style.display = 'inline';
            progressPercent.innerText = percent + '%';
          }
        }
        if (stepIndicator) {
          stepIndicator.innerText = this.getProgressText(index, totalSteps, percent);
          stepIndicator.style.display = (format === 'none' || format === 'percent_only') ? 'none' : 'inline';
        }

        // Botão voltar visível se não for o primeiro
        const backBtn = document.getElementById('btn-back');
        if (backBtn) {
          backBtn.style.display = index > 0 ? 'inline-flex' : 'none';
        }

        // Suporte a etapa com fundo transparente / sem moldura (bloco HTML borderless)
        const cardEl = document.getElementById('quiz-card');
        const hasBorderless = (step.blocks || []).some(b => b.type === 'html' && b.borderless);
        if (cardEl) {
          if (hasBorderless) cardEl.classList.add('card-borderless');
          else cardEl.classList.remove('card-borderless');
        }

        this.trackFunnelEvent('Quiz_Etapa_' + (index + 1), {
          stepIndex: index + 1,
          stepTitle: step.title || 'Sem título'
        });

        // Renderiza conteúdo
        container.innerHTML = this.renderStepHtml(step);

        // Preserva e repassa UTMs para links gerados
        this.applyUtmsToLinks();

        // Inicializa Universal Delays e Fake Loaders
        this.initStepTimers(step);

      clearAllTimers() {
        (this.stepTimers || []).forEach(t => clearTimeout(t));
        this.stepTimers = [];
      },

      initStepTimers(step) {
        const blocks = step.blocks || [];

        // 1. Universal Delay em blocos
        blocks.forEach((b, bIdx) => {
          const delay = parseInt(b.delaySeconds, 10) || 0;
          if (delay > 0) {
            const el = document.getElementById('block-wrap-' + bIdx);
            if (el) {
              const timer = setTimeout(() => {
                el.style.display = 'block';
                setTimeout(() => {
                  el.style.opacity = '1';
                  el.style.transition = 'opacity 0.4s ease';
                }, 20);
              }, delay * 1000);
              this.stepTimers.push(timer);
            }
          }
        });

        // 2. Fake Loader se houver
        const loaderBlock = blocks.find(b => b.type === 'fake_loader');
        if (loaderBlock) {
          this.runFakeLoader(loaderBlock);
        }
      },

      runFakeLoader(block) {
        const durationSec = Math.max(1, parseInt(block.duration, 10) || 4);
        const totalMs = durationSec * 1000;
        const rawMsgs = block.messages || 'Analisando suas respostas...\nCruzando com nosso banco de dados...\nCalculando seu perfil ideal...\nDiagnóstico pronto!';
        const messages = Array.isArray(rawMsgs) ? rawMsgs : rawMsgs.split('\n').map(m => m.trim()).filter(Boolean);

        const barEl = document.getElementById('loader-bar');
        const pctEl = document.getElementById('loader-percent');
        const msgEl = document.getElementById('loader-msg');
        const autoAdvance = block.autoAdvance !== false;

        const startTime = performance.now();
        if (msgEl && messages.length > 0) msgEl.innerText = messages[0];

        const tick = () => {
          const elapsed = performance.now() - startTime;
          const progress = Math.min(1, elapsed / totalMs);

          // Curva orgânica com aceleração
          const eased = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;
          const currentPct = Math.min(100, Math.round(eased * 100));

          if (barEl) barEl.style.width = currentPct + '%';
          if (pctEl) pctEl.innerText = currentPct + '%';

          if (msgEl && messages.length > 0) {
            const msgIdx = Math.min(messages.length - 1, Math.floor(progress * messages.length));
            if (msgEl.innerText !== messages[msgIdx]) {
              msgEl.style.opacity = '0.3';
              setTimeout(() => {
                msgEl.innerText = messages[msgIdx];
                msgEl.style.opacity = '1';
              }, 100);
            }
          }

          if (progress < 1) {
            const timer = setTimeout(tick, 40);
            this.stepTimers.push(timer);
          } else {
            if (barEl) barEl.style.width = '100%';
            if (pctEl) pctEl.innerText = '100%';
            if (msgEl && messages.length > 0) msgEl.innerText = messages[messages.length - 1];

            if (autoAdvance) {
              const timer = setTimeout(() => { this.nextStep(); }, 400);
              this.stepTimers.push(timer);
            }
          }
        };

        const initialTimer = setTimeout(tick, 50);
        this.stepTimers.push(initialTimer);
      },

      extractYouTubeId(url) {
        if (!url) return null;
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|shorts\/)([^#&?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
      },

      escapeHtml(str) {

          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')

          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');

      handleOptionSelect(optIdx) {
        const step = this.config.steps[this.currentStepIndex];
        const qBlock = (step.blocks || []).find(b => b.type === 'question');
        if (!qBlock || !qBlock.options || !qBlock.options[optIdx]) return;

        const selectedOpt = qBlock.options[optIdx];
        this.userAnswers[step.id] = optIdx;
        this.hasAnswered = true;

        const progressSec = document.getElementById('progress-section');
        if (progressSec && this.config.theme && this.config.theme.showProgressBar !== false) {
          progressSec.style.display = 'block';
        }

        // Se a opção permite digitação pelo lead, abre o campo de resposta sem avançar de imediato
        if (selectedOpt.allowCustomText) {
          const container = document.getElementById('step-content');
          if (container) container.innerHTML = this.renderStepHtml(step);
          this.applyUtmsToLinks();
          setTimeout(() => {
            const input = document.getElementById('custom-answer-input-' + optIdx);
            if (input) {
              input.focus();
              input.select();
            }
          }, 50);
          return;
        }

        const useScoring = qBlock.useScoring === true && selectedOpt.points !== undefined && selectedOpt.points !== null && selectedOpt.points !== '' && parseInt(selectedOpt.points, 10) > 0;

        if (useScoring) {
          this.totalScore += parseInt(selectedOpt.points, 10) || 0;
        }

        const headingBlock = (step.blocks || []).find(b => b.type === 'heading');
        const questionTitle = (headingBlock && (headingBlock.title || headingBlock.tag)) || step.title || ('Etapa ' + (this.currentStepIndex + 1));

        this.trackFunnelEvent('Quiz_Resposta', {
          stepIndex: this.currentStepIndex + 1,
          question: questionTitle,
          answer: selectedOpt.text || '',
          points: useScoring ? (parseInt(selectedOpt.points, 10) || 0) : ''
        });

        const container = document.getElementById('step-content');
        if (container) container.innerHTML = this.renderStepHtml(step);
        this.applyUtmsToLinks();

        if (selectedOpt.targetStepIndex !== undefined && selectedOpt.targetStepIndex !== '') {
          const targetIndex = parseInt(selectedOpt.targetStepIndex, 10);
          setTimeout(() => this.renderStep(targetIndex), 250);
          return;
        }

        const hasDelay = (step.blocks || []).some(b => (parseInt(b.delaySeconds, 10) || 0) > 0);
        if (!hasDelay) {
          setTimeout(() => this.nextStep(), 250);
        }
      },

      submitCustomOption(optIdx) {
        const step = this.config.steps[this.currentStepIndex];
        const qBlock = (step.blocks || []).find(b => b.type === 'question');
        if (!qBlock || !qBlock.options || !qBlock.options[optIdx]) return;

        const selectedOpt = qBlock.options[optIdx];
        const input = document.getElementById('custom-answer-input-' + optIdx);
        const typedText = input ? input.value.trim() : '';

        if (!this.customAnswers) this.customAnswers = {};
        this.customAnswers[step.id] = typedText;
        this.hasAnswered = true;

        const useScoring = qBlock.useScoring === true && selectedOpt.points !== undefined && selectedOpt.points !== null && selectedOpt.points !== '' && parseInt(selectedOpt.points, 10) > 0;

        if (useScoring) {
          this.totalScore += parseInt(selectedOpt.points, 10) || 0;
        }

        const headingBlock = (step.blocks || []).find(b => b.type === 'heading');
        const questionTitle = (headingBlock && (headingBlock.title || headingBlock.tag)) || step.title || ('Etapa ' + (this.currentStepIndex + 1));
        const finalAnswer = typedText ? (selectedOpt.text ? (selectedOpt.text + ': ' + typedText) : typedText) : (selectedOpt.text || '');

        this.trackFunnelEvent('Quiz_Resposta', {
          stepIndex: this.currentStepIndex + 1,
          question: questionTitle,
          answer: finalAnswer,
          customText: typedText,
          points: useScoring ? (parseInt(selectedOpt.points, 10) || 0) : ''
        });

        const container = document.getElementById('step-content');
        if (container) container.innerHTML = this.renderStepHtml(step);
        this.applyUtmsToLinks();

        if (selectedOpt.targetStepIndex !== undefined && selectedOpt.targetStepIndex !== '') {
          const targetIndex = parseInt(selectedOpt.targetStepIndex, 10);
          setTimeout(() => this.renderStep(targetIndex), 250);
          return;
        }

        const hasDelay = (step.blocks || []).some(b => (parseInt(b.delaySeconds, 10) || 0) > 0);
        if (!hasDelay) {
          setTimeout(() => this.nextStep(), 250);
        }

      handleLeadSubmit(e) {
        e.preventDefault();
        const nameInput = document.getElementById('lead-name');
        const phoneInput = document.getElementById('lead-whatsapp');
        const emailInput = document.getElementById('lead-email');

        this.leadData = {
          name: nameInput ? nameInput.value.trim() : '',
          whatsapp: phoneInput ? phoneInput.value.trim() : '',
          email: emailInput ? emailInput.value.trim() : ''
        };

        this.trackFunnelEvent('Lead', {
          name: this.leadData.name,
          whatsapp: this.leadData.whatsapp,
          email: this.leadData.email,
          score: this.totalScore
        });

        this.nextStep();
      },

      nextStep() {
        if (this.currentStepIndex + 1 < this.config.steps.length) {
          this.renderStep(this.currentStepIndex + 1);
        }
      },

      prevStep() {
        if (this.currentStepIndex > 0) {
          this.renderStep(this.currentStepIndex - 1);
        }
      },

      trackFunnelEvent(eventName, eventData) {
        const utms = this.utmParams || {};
        const srcVal = utms.src || utms.sck || utms.SRC || utms.SCK || '';
        const payload = {
          sessionId: this.sessionId,
          event: eventName,
          quizId: this.config.id || 'meu-quiz',
          quizTitle: this.config.title || 'Quiz de Vendas',
          timestamp: new Date().toISOString(),
          src: srcVal,
          utm_source: utms.utm_source || utms.source || '',
          utm_campaign: utms.utm_campaign || utms.campaign || '',
          utm_medium: utms.utm_medium || utms.medium || '',
          utm_content: utms.utm_content || utms.content || '',
          utm_term: utms.utm_term || utms.term || '',
          utms: utms,
          lead: this.leadData,
          answers: this.userAnswers,
          totalScore: this.totalScore,
          data: eventData
        };

        if (window.fbq) {
          try {
            if (eventName === 'Lead') fbq('track', 'Lead');
            else fbq('trackCustom', eventName, eventData);
          } catch(err) {}
        }

        if (window.gtag) {
          try { gtag('event', eventName, eventData); } catch(err) {}
        }

        const targetUrl = (this.config.tracking && this.config.tracking.sheetUrl) || (this.config.tracking && this.config.tracking.webhookUrl);
        if (targetUrl && targetUrl.trim() !== '') {
          try {
            fetch(targetUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            }).catch(() => {});
          } catch(err) {}
        }
      }
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => { QuizApp.init(); });
    } else {
      QuizApp.init();
    }
  </script>
  
</body>
